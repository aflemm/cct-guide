site_url = "https://aflemm.github.io/cct-guide/"
site_description = "Product guides for Curling Tools products."
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["assets/stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "SmartBroom" = [
    { "Getting Started" = "smartbroom/getting-started.md" },
    { "Essentials" = [
      { "SmartBroom App" = "smartbroom/smartbroom-app.md" },
      { "Charging" = "smartbroom/charging.md" },
      { "Connecting" = "smartbroom/connecting-smartbroom.md" },
      { "Live Sweeping" = "smartbroom/using-smartbroom.md" },
      { "Understanding Results" = "smartbroom/understanding-results.md" },
    ] },
    { "Beyond" = [
      { "Background Recording" = "smartbroom/background-recording.md" },
      { "Bonding and Ownership" = "smartbroom/bonding.md" },
      { "Sessions and Downloads" = "smartbroom/sessions.md" },
      { "Multiple Windows on iPad" = "smartbroom/ipad-windows.md" },
      { "Raw Live Data" = "smartbroom/raw-live-data.md" },
      { "LED Indication" = "smartbroom/led-indicators.md" },
      { "Settings" = "smartbroom/settings.md" },
      { "Firmware Updates" = "smartbroom/firmware-updates.md" },
    ] },
  ] },
  { "SmartBeam" = [
    { "Getting Started" = "smartbeam/getting-started.md" },
    { "Essentials" = [
      { "SmartBeam App" = "smartbeam/smartbeam-app.md" },
      { "Charging" = "smartbeam/charging.md" },
      { "Connecting" = "smartbeam/connecting-smartbeam.md" },
      { "Setting up Beams" = [
        { "Setting up Beams" = "smartbeam/setting-up-beams/index.md" },
        { "Choosing Measurements" = "smartbeam/choosing-measurements.md" },
        { "Beam Alignment" = "smartbeam/beam-alignment.md" },
        { "Managing Beams in the App" = "smartbeam/setting-up-beams/managing-beams-in-the-app.md" },
      ] },
      { "Arming and Timing" = [
        { "Arming and Timing" = "smartbeam/arming-and-timing/index.md" },
        { "Timing Lights and Status" = "smartbeam/arming-and-timing/timing-lights-and-status.md" },
        { "Arming Modes" = "smartbeam/arming-modes.md" },
        { "Cancelling and Timeouts" = "smartbeam/cancelling-and-timeouts.md" },
      ] },
      { "Understanding Results" = "smartbeam/understanding-results.md" },
    ] },
    { "Beyond" = [
      { "History and Data" = "smartbeam/history-and-data.md" },
      { "Saved Devices" = "smartbeam/saved-devices.md" },
      { "LED Indication" = "smartbeam/led-indication.md" },
      { "Settings" = "smartbeam/settings.md" },
      { "Firmware Updates" = "smartbeam/firmware-updates.md" },
      { "RockArm" = "smartbeam/rockarm.md" },
    ] },
  ] },
  { "Contact" = "contact.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
# Official wordmark from the Curling Tools website.
logo = "assets/images/shared/curling-tools-logo.png"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.tabs.link",
]
# Use system fonts without requesting a hosted font service.
font = false

# Always follow the browser preference, with no user-facing selector.
# The automatic entry uses the light/dark entries below for its colors.
[[project.theme.palette]]
media = "(prefers-color-scheme)"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"

[project.extra]
generator = false
homepage = "https://www.curling.tools/"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
toc.permalink = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.validation.links]
not_found = "warn"
anchors = "warn"
