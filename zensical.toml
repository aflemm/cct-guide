[project]
site_name = "Curling Tools User Guide"
# Temporary sharing URL; restore https://guide.curling.tools/ when the domain is connected.
site_url = "https://aflemm.github.io/cct-guide/"
site_description = "User guides for Curling Tools products."
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["assets/stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "SmartBroom" = [
    { "Getting started" = "smartbroom/getting-started.md" },
    { "Details" = [
      { "Connecting SmartBroom" = "smartbroom/connecting-smartbroom.md" },
      { "Charging" = "smartbroom/charging.md" },
      { "Using SmartBroom" = "smartbroom/using-smartbroom.md" },
      { "LED indicators" = "smartbroom/led-indicators.md" },
      { "Background recording" = "smartbroom/background-recording.md" },
      { "Sessions" = "smartbroom/sessions.md" },
      { "Charts" = "smartbroom/charts.md" },
      { "Video" = "smartbroom/video.md" },
      { "Settings" = "smartbroom/settings.md" },
      { "Firmware updates" = "smartbroom/firmware-updates.md" },
      { "Troubleshooting" = [
        { "Overview" = "smartbroom/troubleshooting/index.md" },
        { "Bluetooth and pairing" = "smartbroom/troubleshooting/bluetooth-and-pairing.md" },
        { "Charging" = "smartbroom/troubleshooting/charging.md" },
        { "Recording" = "smartbroom/troubleshooting/recording.md" },
        { "Firmware updates" = "smartbroom/troubleshooting/firmware-updates.md" },
        { "Reset" = "smartbroom/troubleshooting/reset.md" },
      ] },
    ] },
  ] },
  { "SmartBeam" = [
    { "Getting started" = "smartbeam/getting-started.md" },
    { "Essentials" = [
      { "SmartBeam App" = "smartbeam/smartbeam-app.md" },
      { "Connecting" = "smartbeam/connecting-smartbeam.md" },
      { "Setting up Beams" = "smartbeam/setting-up-beams.md" },
      { "Arming and Timing" = "smartbeam/arming-and-timing.md" },
      { "Understanding Results" = "smartbeam/understanding-results.md" },
      { "Charging" = "smartbeam/charging.md" },
    ] },
    { "Beyond" = [
      { "History and Data" = "smartbeam/history-and-data.md" },
      { "Saved Devices" = "smartbeam/saved-devices.md" },
      { "LED Indication" = "smartbeam/led-indication.md" },
      { "Settings" = "smartbeam/settings.md" },
      { "Firmware Updates" = "smartbeam/firmware-updates.md" },
    ] },
  ] },
  { "Contact" = "contact.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
# Official wordmark from the Curling Tools website.
logo = "assets/images/shared/curling-tools-logo.png"
# Add an approved favicon before enabling this path:
# favicon = "assets/images/shared/favicon.png"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.tabs.link",
]
# Use system fonts without requesting a hosted font service.
font = false

# Always follow the browser preference, with no user-facing selector.
# The automatic entry uses the light/dark entries below for its colors.
[[project.theme.palette]]
media = "(prefers-color-scheme)"

# Temporary standard palette; change primary/accent here for approved branding.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"

[project.extra]
generator = false
homepage = "https://www.curling.tools/"

# Add approved social/contact destinations; no account URLs are assumed.
# [[project.extra.social]]
# icon = "lucide/mail"
# link = "mailto:APPROVED_SUPPORT_ADDRESS"
# name = "Contact Curling Tools"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
toc.permalink = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.base_path = ["docs/_shared"]
pymdownx.snippets.check_paths = true

[project.validation.links]
not_found = "warn"
anchors = "warn"

# Native exclusion support; no third-party plugin dependency is needed.
[project.plugins.exclude]
glob = ["_shared/**"]
